<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Book Tracker</title>
</head>
<body>

<h1>Library Book Tracker</h1>

<h2>All Books</h2>

<table border="5">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Genre</th>
        <th>Year</th>
        <th>Available</th>
    </tr>

    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.genre}"></td>
        <td th:text="${book.publicationYear}"></td>
        <td th:text="${book.available}"></td>
    </tr>
</table>

<div th:if="${isAdmin}">
    <h2>Add Book</h2>

    <form th:action="@{/library}"
          th:object="${bookRequest}"
          method="post">

        <input th:field="*{title}"
               placeholder="Title" required>

        <input th:field="*{author}"
               placeholder="Author" required>

        <input th:field="*{genre}"
               placeholder="Genre" required>

        <input th:field="*{publicationYear}"
               type="number" min="1" required>

        <button type="submit">Add Book</button>
    </form>


</div>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
